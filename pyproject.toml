[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-platform-foundation"
version = "0.1.0"
description = "Read-only AWS FinOps intelligence platform foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "bandit>=1.7,<2",
  "moto>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["finops_platform"]
