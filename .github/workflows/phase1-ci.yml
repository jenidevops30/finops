name: Phase 1 Foundation CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install foundation
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest --cov=finops_platform --cov-report=term-missing
      - name: Bandit
        run: bandit -r src
